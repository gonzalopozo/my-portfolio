name: Preview checks
on:
    deployment_status:
    workflow_dispatch:
        inputs:
            deployment_id:
                description: Vercel Preview deployment ID
                required: true
                type: string
            acceptance:
                description: Run authenticated tests against a disposable synthetic Preview only
                type: boolean
                default: false
permissions: {}
concurrency:
    group: preview-${{ github.event.deployment.id || inputs.deployment_id }}
    cancel-in-progress: true
jobs:
    smoke:
        name: Preview / Smoke
        if: github.event_name == 'workflow_dispatch' || (github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'Preview')
        environment: preview-checks
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        permissions:
            contents: read
        outputs:
            origin: ${{ steps.preview.outputs.origin }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: main
                  persist-credentials: false
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version-file: .nvmrc
                  package-manager-cache: false
            - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
              with:
                  version: 12.14.0
                  cache: false
                  run_install: false
            - run: pnpm install --frozen-lockfile --ignore-scripts
            - id: preview
              run: pnpm tsx scripts/preview.mts
              env:
                  DEPLOYMENT_ID: ${{ inputs.deployment_id }}
                  VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
                  VERCEL_TEAM_ID: ${{ vars.VERCEL_TEAM_ID }}
                  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
                  VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
    acceptance:
        name: Preview / Acceptance
        if: github.event_name == 'workflow_dispatch' && inputs.acceptance && github.ref == 'refs/heads/main'
        needs: smoke
        environment: preview-acceptance
        runs-on: ubuntu-24.04
        timeout-minutes: 20
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: main
                  persist-credentials: false
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version-file: .nvmrc
                  package-manager-cache: false
            - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
              with:
                  version: 12.14.0
                  cache: false
                  run_install: false
            - run: pnpm install --frozen-lockfile --ignore-scripts
            - run: pnpm exec playwright install --with-deps chromium firefox webkit
            - run: pnpm exec playwright test --config playwright.csp.config.ts
              env:
                  CSP_TEST_BASE_URL: ${{ needs.smoke.outputs.origin }}
                  PLAYWRIGHT_BASE_URL: ${{ needs.smoke.outputs.origin }}
                  VERIFIED_PREVIEW_ORIGIN: ${{ needs.smoke.outputs.origin }}
                  CSP_TEST_PREVIEW_BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
                  CSP_TEST_ADMIN_EMAIL: ${{ secrets.PREVIEW_ADMIN_EMAIL }}
                  CSP_TEST_ADMIN_PASSWORD: ${{ secrets.PREVIEW_ADMIN_PASSWORD }}
