name: Security
on:
    pull_request:
        branches: [main, restructure]
    push:
        branches: [main, restructure]
    schedule:
        - cron: '17 6 * * *'
    workflow_dispatch:
permissions: {}
concurrency:
    group: security-${{ github.event.pull_request.number || github.run_id }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
    dependencies:
        name: Security / Dependencies
        runs-on: ubuntu-24.04
        timeout-minutes: 15
        permissions:
            contents: read
            pull-requests: read
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version-file: .nvmrc
                  package-manager-cache: false
            - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
              with:
                  version: 12.14.0
                  cache: false
                  run_install: false
            - run: pnpm install --frozen-lockfile --ignore-scripts
            - run: pnpm audit --audit-level high
            - name: Review dependency changes
              if: github.event_name == 'pull_request'
              uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
              with:
                  fail-on-severity: high
                  fail-on-scopes: runtime, development, unknown
    secrets:
        name: Security / Secrets
        runs-on: ubuntu-24.04
        timeout-minutes: 15
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0
                  persist-credentials: false
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version-file: .nvmrc
                  package-manager-cache: false
            - run: node scripts/scan-secrets.mjs
              env:
                  SCAN_BASE: ${{ github.event.pull_request.base.sha }}
                  SCAN_HEAD: ${{ github.event.pull_request.head.sha }}
