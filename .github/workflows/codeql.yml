name: CodeQL
on:
    pull_request:
        branches: [main, restructure]
    push:
        branches: [main, restructure]
    schedule:
        - cron: '43 5 * * 1'
    workflow_dispatch:
permissions: {}
concurrency:
    group: codeql-${{ github.event.pull_request.number || github.run_id }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
    analyze:
        name: Security / CodeQL ${{ matrix.label }}
        runs-on: ubuntu-24.04
        timeout-minutes: 25
        permissions:
            contents: read
            security-events: write
        strategy:
            fail-fast: false
            matrix:
                include:
                    - language: javascript-typescript
                      label: JS
                    - language: actions
                      label: Actions
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version-file: .nvmrc
                  package-manager-cache: false
            - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
              with:
                  languages: ${{ matrix.language }}
                  config-file: ./.github/codeql/config.yml
                  build-mode: none
                  dependency-caching: false
                  queries: ${{ matrix.language == 'javascript-typescript' && 'security-extended' || '' }}
            - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
              with:
                  category: /language:${{ matrix.language }}
                  output: .ci/codeql
            - name: Block high, critical and error findings
              run: node scripts/scan-codeql.mjs
