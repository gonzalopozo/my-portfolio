name: CI
on:
    pull_request:
        branches: [main, restructure]
    push:
        branches: [main, restructure]
    workflow_dispatch:
permissions: {}
concurrency:
    group: ci-${{ github.event.pull_request.number || github.run_id }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
    APP_ENV: test
    BLOB_PUBLIC_HOSTNAME: https://fixture.public.blob.vercel-storage.com
jobs:
    quality:
        name: CI / Quality
        runs-on: ubuntu-24.04
        timeout-minutes: 15
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version-file: .nvmrc
                  package-manager-cache: false
            - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
              with:
                  version: 12.14.0
                  cache: false
                  run_install: false
            - run: pnpm install --frozen-lockfile --ignore-scripts
            - run: pnpm ci:quality
            - name: Check pull request title
              if: github.event_name == 'pull_request'
              env:
                  PR_TITLE: ${{ github.event.pull_request.title }}
              run: printf '%s\n' "$PR_TITLE" | pnpm exec commitlint
    tests:
        name: CI / Tests
        runs-on: ubuntu-24.04
        timeout-minutes: 20
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version-file: .nvmrc
                  package-manager-cache: false
            - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
              with:
                  version: 12.14.0
                  cache: false
                  run_install: false
            - run: pnpm install --frozen-lockfile --ignore-scripts
            - run: pnpm test:coverage
            - name: Upload synthetic diagnostics
              if: always()
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: tests-${{ github.run_id }}
                  path: coverage/
                  retention-days: 3
                  if-no-files-found: ignore
    migrations:
        name: CI / Migrations
        runs-on: ubuntu-24.04
        timeout-minutes: 15
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version-file: .nvmrc
                  package-manager-cache: false
            - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
              with:
                  version: 12.14.0
                  cache: false
                  run_install: false
            - run: pnpm install --frozen-lockfile --ignore-scripts
            - run: pnpm migrate:check
    production:
        name: CI / Production E2E
        runs-on: ubuntu-24.04
        timeout-minutes: 50
        permissions:
            contents: read
        needs: [quality, tests, migrations]
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version-file: .nvmrc
                  package-manager-cache: false
            - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
              with:
                  version: 12.14.0
                  cache: false
                  run_install: false
            - run: pnpm install --frozen-lockfile --ignore-scripts
            - run: pnpm exec playwright install --with-deps chromium firefox webkit
            - run: pnpm test:e2e:prod
            - name: Upload synthetic diagnostics
              if: failure()
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: production-${{ github.run_id }}
                  path: playwright-report/
                  retention-days: 3
                  if-no-files-found: ignore
    required:
        name: CI / Required
        runs-on: ubuntu-24.04
        timeout-minutes: 2
        needs: [quality, tests, migrations, production]
        if: always()
        steps:
            - name: Require every gate
              env:
                  RESULTS: ${{ toJSON(needs) }}
              run: |
                  python3 - <<'PY'
                  import json, os
                  assert all(job['result'] == 'success' for job in json.loads(os.environ['RESULTS']).values()), 'A required gate failed, was cancelled, or was skipped.'
                  PY
