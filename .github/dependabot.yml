version: 2
updates:
    - package-ecosystem: npm
      directory: /
      schedule:
          interval: weekly
          day: monday
          time: '07:00'
          timezone: Europe/Madrid
      open-pull-requests-limit: 5
      cooldown:
          default-days: 1
      groups:
          react:
              patterns: [react, react-dom, '@types/react*']
          next:
              patterns: [next, eslint-config-next]
          vitest:
              # Core and coverage must use the same version; plugins release independently.
              # Dependabot grouping is best effort; CI rejects mismatched installed versions.
              patterns: [vitest, '@vitest/coverage-v8']
          development-minor:
              dependency-type: development
              update-types: [minor, patch]
      commit-message:
          prefix: build(deps)
    - package-ecosystem: github-actions
      directory: /
      schedule:
          interval: weekly
          day: monday
      open-pull-requests-limit: 3
      groups:
          actions:
              patterns: ['*']
      commit-message:
          prefix: ci(deps)
